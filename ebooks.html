<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All ebooks — Zenvora Digital</title><link rel="icon" type="image/svg+xml" href="assets/zenvora-logo.svg"><link rel="stylesheet" href="assets/zenvora-theme.css"><style>html,body{background:#10072a!important;color:#f5f0ff!important}body{background:radial-gradient(ellipse at 15% 0%,#7c3aed77,transparent 45%),linear-gradient(145deg,#0d0620,#21104e 52%,#10072a)!important;background-attachment:fixed!important}.page{max-width:1200px;margin:55px auto;padding:0 22px}.page h1{color:#fff;font-size:clamp(2rem,5vw,3.5rem)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{padding:22px;border:1px solid #ffffff25;border-radius:20px;background:#ffffff0d}.card h2{color:white;font-size:1.1rem}.muted{color:#d0bdf7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}</style></head><body class="template-index"><header class="header-wrap is-sticky"><div class="header glass container"><a class="header__brand" href="./"><img class="header__logo" src="assets/zenvora-logo.svg" alt="Zenvora Digital" width="180" height="50"></a><nav class="header__nav"><ul><li><a href="./#new-releases">New releases</a></li><li><a href="./#bestsellers">Bestsellers</a></li><li><a href="./#faq">FAQ</a></li></ul></nav><div class="header__icons"><a class="icon-btn" href="search.html">⌕</a><a class="icon-btn" href="cart.html">🛒</a></div></div></header><main class="page"><p class="eyebrow">THE ZENVORA LIBRARY</p><h1>Explore all ebooks</h1><p class="muted">Browse the full collection of digital books and guides.</p><div id="books" class="grid">Loading ebooks…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];function buy(b){let c=[];try{c=JSON.parse(localStorage.getItem('zenvoraCart')||'[]')}catch(e){}let x=c.find(i=>i.id===b.id);if(x)x.qty++;else c.push({id:b.id,title:b.title,price:Number(b.price||0),category:b.category||'Digital ebook',qty:1});localStorage.setItem('zenvoraCart',JSON.stringify(c));location.href='cart.html'}fetch('ebook.json').then(r=>r.json()).then(d=>{all=(d.ebooks||[]).filter(b=>b.published!==false);document.getElementById('books').innerHTML=all.map((b,i)=>'<article class="card"><h2>'+esc(b.title)+'</h2><p class="muted">'+esc(b.category||'Digital ebook')+'</p><p class="muted">'+esc(b.description||'')+'</p><strong>₹'+Number(b.price||0).toLocaleString('en-IN')+'</strong><div class="actions"><a class="btn btn--ghost btn--small" href="ebook.html?id='+encodeURIComponent(b.id)+'">Details</a><button class="btn btn--small" data-buy="'+i+'">Buy now</button></div></article>').join('')||'<p>No ebooks available yet.</p>';document.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buy(all[+x.dataset.buy]))}).catch(()=>document.getElementById('books').textContent='Could not load ebooks. Please refresh.');</script></body></html>
