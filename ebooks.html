</head><body class="template-index"><header class="header-wrap is-sticky"><div class="header glass container"><button class="header__burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="MobileNav" data-menu-toggle><span class="when-closed" aria-hidden="true">☰</span><span class="when-open" aria-hidden="true">×</span></button><a class="header__brand" href="./"><img class="header__logo" src="assets/zenvora-logo.svg" alt="Zenvora Digital" width="180" height="50"></a><nav class="header__nav"><ul><li><a href="./#new-releases">New releases</a></li><li><a href="./#bestsellers">Explore more</a></li><li><a href="./#faq">FAQ</a></li></ul></nav><div class="header__icons"><a class="icon-btn" href="search.html">⌕</a><a class="icon-btn" href="cart.html">🛒</a></div></div><div class="mobile-nav glass container" id="MobileNav" hidden><ul><li><a href="./">Home</a></li><li><a href="ebooks.html">All ebooks</a></li><li><a href="search.html">Search</a></li><li><a href="about.html">About the founder</a></li><li><a href="contact.html">Contact</a></li><li><a href="cart.html">Cart</a></li></ul></div></header><main class="page"><p class="eyebrow">THE ZENVORA LIBRARY</p><h1>Explore all ebooks</h1><p class="muted">Browse the full collection of digital books and guides.</p><div id="books" class="grid">Loading ebooks…</div></main><script src="assets/zenvora-config.js" defer></script>
  <script src="assets/zenvora-analytics.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=[];
function buy(b){let c=[];try{c=JSON.parse(localStorage.getItem('zenvoraCart')||'[]')}catch(e){}let x=c.find(i=>i.id===b.id);if(x)x.qty++;else c.push({id:b.id,title:b.title,price:Number(b.price||0),category:b.category||'Digital ebook',qty:1});localStorage.setItem('zenvoraCart',JSON.stringify(c));location.href='cart.html'}
function showBooks(){
 const el=document.getElementById('books');
 el.innerHTML=all.length?all.map((b,i)=>'<article class="card">'+(b.cover?'<img class="card-cover" src="'+esc(b.cover)+'" alt="Cover of '+esc(b.title)+'" loading="lazy" width="400" height="520">':'<div class="card-cover-placeholder" aria-label="No cover image available">'+esc(b.title)+'</div>')+'<h2>'+esc(b.title)+'</h2><p class="muted">'+esc(b.category||'Digital ebook')+'</p><p class="muted">'+esc(b.description||'')+'</p><strong>₹'+Number(b.price||0).toLocaleString('en-IN')+'</strong><div class="actions"><a class="btn btn--ghost btn--small" href="ebook.html?id='+encodeURIComponent(b.id)+'">Details</a><button class="btn btn--small" data-buy="'+i+'">Buy now</button></div></article>').join(''):'<p>No published ebooks are available yet.</p>';
 el.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buy(all[+x.dataset.buy]));
}
const cfg=window.ZENVORA_CONFIG;
if(!cfg||!cfg.supabaseUrl||!cfg.supabasePublishableKey){
 document.getElementById('books').textContent='The live catalogue is not configured. Please refresh later.';
}else{
 fetch(cfg.supabaseUrl+'/rest/v1/ebooks?select=id,slug,title,description,price_paise,cover_url,is_active&is_active=eq.true&order=created_at.desc',{headers:{apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+cfg.supabasePublishableKey}})
 .then(r=>{if(!r.ok)throw Error('Catalogue request failed ('+r.status+')');return r.json()})
 .then(rows=>{if(!Array.isArray(rows))throw Error('Invalid catalogue response');all=rows.map(x=>({id:x.slug,title:x.title,description:x.description,price:Number(x.price_paise||0)/100,category:'Digital ebook',cover:x.cover_url,published:x.is_active}));showBooks()})
 .catch(err=>{console.error('Zenvora live catalogue error:',err);document.getElementById('books').textContent='We could not load the live catalogue. Please refresh. Demo products are hidden.'});
}
</script></body></html>
