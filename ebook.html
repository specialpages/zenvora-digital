  <script src="assets/zenvora-analytics.js"></script><script>
(function(){'use strict';var el=document.getElementById('detail'),cfg=window.ZENVORA_CONFIG||{},slug=new URLSearchParams(location.search).get('id');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){return '₹'+(Number(v)||0).toLocaleString('en-IN')}
function cart(){try{var c=JSON.parse(localStorage.getItem('zenvoraCart')||'[]');return Array.isArray(c)?c:[]}catch(e){return []}}
function add(b,go){var c=cart(),x=c.find(function(i){return i.id===b.id});if(x)x.qty=Math.min(99,(Number(x.qty)||1)+1);else c.push({id:b.id,title:b.title,price:b.price,category:'Digital ebook',qty:1});localStorage.setItem('zenvoraCart',JSON.stringify(c));if(go){location.href='cart.html';return}var btn=document.getElementById('add');btn.textContent='Added to cart ✓';}
function fail(message){el.innerHTML='<div><p class="eyebrow">ZENVORA LIBRARY</p><h1>Ebook unavailable</h1><p class="muted">'+esc(message)+'</p><div class="actions"><a class="btn" href="ebooks.html">Browse all ebooks</a><a class="btn btn--ghost" href="contact.html">Get support</a></div></div>'}
document.getElementById('year').textContent=new Date().getFullYear();
if(!slug){fail('This page needs a valid ebook link. Browse our current collection to find an ebook.');return}
if(!cfg.supabaseUrl||!cfg.supabasePublishableKey){fail('The live catalogue is temporarily unavailable. Please try again later.');return}
fetch(cfg.supabaseUrl+'/rest/v1/ebooks?select=id,slug,title,description,price_paise,cover_url,is_active&slug=eq.'+encodeURIComponent(slug)+'&is_active=eq.true&limit=1',{headers:{apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+cfg.supabasePublishableKey}}).then(function(r){if(!r.ok)throw Error('Catalogue request failed');return r.json()}).then(function(rows){if(!Array.isArray(rows)||!rows[0]){fail('This ebook may have been unpublished or the link may be incorrect.');return}var x=rows[0],b={id:x.slug,title:x.title,description:x.description,price:Number(x.price_paise||0)/100,cover:x.cover_url};document.title=b.title+' — Zenvora Digital';var cover=b.cover?'<img class="cover" src="'+esc(b.cover)+'" alt="Cover of '+esc(b.title)+'" width="600" height="800">':'<div class="cover catalogue-cover" role="img" aria-label="No cover image available"><span>'+esc(b.title)+'</span></div>';el.innerHTML='<div>'+cover+'</div><div><p class="eyebrow">ZENVORA DIGITAL · EBOOK</p><h1>'+esc(b.title)+'</h1><p class="muted">'+esc(b.description||'A digital ebook from Zenvora Digital.')+'</p><div class="price">'+money(b.price)+'</div><p class="notice">Checkout is handled through the configured payment flow. Download access is issued after payment verification.</p><div class="actions"><button class="btn" id="buy" type="button">Buy now</button><button class="btn btn--ghost" id="add" type="button">Add to cart</button><a class="btn btn--ghost" href="ebooks.html">All ebooks</a></div><p class="muted" style="margin-top:18px;font-size:.9rem">Questions? <a href="contact.html">Contact support</a>. Review our <a href="refunds.html">refund policy</a> before purchasing.</p></div>';document.getElementById('buy').addEventListener('click',function(){add(b,true)});document.getElementById('add').addEventListener('click',function(){add(b,false)})}).catch(function(){fail('We could not load this ebook right now. Please refresh or contact support if the problem continues.')});
})();
