<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ebook — Zenvora Digital</title><link rel="icon" type="image/svg+xml" href="assets/zenvora-logo.svg"><link rel="stylesheet" href="assets/zenvora-theme.css"><style>html,body{background:#10072a!important;color:#f5f0ff!important}body{background:radial-gradient(ellipse at 15% 0%,#7c3aed77,transparent 45%),linear-gradient(145deg,#0d0620,#21104e 52%,#10072a)!important;background-attachment:fixed!important}.page{max-width:900px;margin:70px auto;padding:0 22px}.panel{padding:clamp(24px,5vw,48px);border:1px solid #ffffff2b;border-radius:26px;background:#ffffff0d}.page h1{color:#fff;font-size:clamp(2rem,5vw,3.3rem)}.muted{color:#d0bdf7;line-height:1.8}.price{font-size:1.5rem;font-weight:800;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}</style></head><body class="template-index"><header class="header-wrap is-sticky"><div class="header glass container"><a class="header__brand" href="./"><img class="header__logo" src="assets/zenvora-logo.svg" alt="Zenvora Digital" width="180" height="50"></a><div class="header__icons"><a class="icon-btn" href="search.html">⌕</a><a class="icon-btn" href="cart.html">🛒</a></div></div></header><main class="page"><div class="panel" id="detail">Loading ebook…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('ebook.json').then(r=>r.json()).then(d=>{const b=(d.ebooks||[]).find(x=>x.id===new URLSearchParams(location.search).get('id')&&x.published!==false);if(!b){document.getElementById('detail').innerHTML='<h1>Ebook not found</h1><a class="btn" href="ebooks.html">Browse ebooks</a>';return}document.title=b.title+' — Zenvora Digital';document.getElementById('detail').innerHTML='<p class="eyebrow">'+esc(b.category||'Digital ebook')+'</p><h1>'+esc(b.title)+'</h1><p class="muted">'+esc(b.description||'')+'</p><div class="price">₹'+Number(b.price||0).toLocaleString('en-IN')+'</div><p class="muted">Digital product · Secure checkout and instant delivery will be enabled after payment setup.</p><div class="actions"><button class="btn" id="buy">Buy now</button><a class="btn btn--ghost" href="ebooks.html">Browse all ebooks</a></div>';document.getElementById('buy').onclick=()=>{let c=[];try{c=JSON.parse(localStorage.getItem('zenvoraCart')||'[]')}catch(e){}let x=c.find(i=>i.id===b.id);if(x)x.qty++;else c.push({id:b.id,title:b.title,price:Number(b.price||0),category:b.category||'Digital ebook',qty:1});localStorage.setItem('zenvoraCart',JSON.stringify(c));location.href='cart.html'}}).catch(()=>document.getElementById('detail').textContent='Could not load this ebook. Please refresh.');</script></body></html>
