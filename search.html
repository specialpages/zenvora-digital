<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2a1160"><title>Search ebooks — Zenvora Digital</title><link rel="icon" type="image/svg+xml" href="assets/zenvora-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/zenvora-theme.css"><style>.tool-page{max-width:1100px;margin:64px auto;padding:0 22px;min-height:55vh}.tool-page h1{font:800 clamp(2rem,5vw,3.5rem) Sora,sans-serif}.searchbox{display:flex;gap:10px;margin:26px 0 30px}.searchbox input{flex:1;min-width:0;padding:16px 18px;border:1px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(255,255,255,.09);color:#fff;font:inherit}.searchbox input::placeholder{color:#c8b8e8}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.result{padding:22px;border:1px solid rgba(255,255,255,.17);border-radius:20px;background:rgba(255,255,255,.07)}.result h2{font:700 1.1rem Sora,sans-serif}.result p{color:#c8b8e8;line-height:1.6}.mutedline{color:#c8b8e8}.tool-foot{text-align:center;padding:30px;color:#c8b8e8}</style></head><body class="template-index"><div class="announce"><span class="announce__text">✦ Instant download. Read anywhere. Secure checkout.</span></div><header class="header-wrap is-sticky"><div class="header glass container"><a class="header__brand" href="./" aria-label="Zenvora Digital home"><img class="header__logo" src="assets/zenvora-logo.svg" alt="Zenvora Digital" width="180" height="50"></a><nav class="header__nav" aria-label="Main"><ul><li><a href="./#new-releases">New releases</a></li><li><a href="./#why-us">Why Zenvora</a></li><li><a href="./#bestsellers">Bestsellers</a></li><li><a href="./#faq">FAQ</a></li></ul></nav><div class="header__icons"><a class="icon-btn" href="search.html" aria-label="Search">⌕</a><a class="icon-btn" href="cart.html" aria-label="Cart">🛒</a></div></div></header><main class="tool-page"><p class="eyebrow">Find your next read</p><h1>Search ebooks</h1><p class="mutedline">Explore practical digital books and guides from Zenvora.</p><form class="searchbox" id="searchForm"><input id="query" type="search" placeholder="Search by title, topic or category…" aria-label="Search ebooks" autocomplete="off"><button class="btn" type="submit">Search</button></form><div id="results" class="results" aria-live="polite"><p class="mutedline">Loading ebooks…</p></div></main><footer class="tool-foot">© <span id="year"></span> Zenvora Digital · <a href="./">Back to home</a> · <a href="cart.html">Cart</a></footer><script>let books=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('query').value.trim().toLowerCase();const list=books.filter(b=>b.published!==false&&[b.title,b.category,b.description].join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=list.length?list.map(b=>'<article class="result"><p class="eyebrow">'+esc(b.category||'Digital ebook')+'</p><h2>'+esc(b.title)+'</h2><p>'+esc(b.description||'')+'</p><strong>₹'+Number(b.price||0).toLocaleString('en-IN')+'</strong><p><a class="btn btn--small" href="./#new-releases">View on homepage</a></p></article>').join(''):'<p class="mutedline">No ebooks match that search. Try another title or category.</p>';}fetch('ebook.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{books=Array.isArray(d.ebooks)?d.ebooks:[];render()}).catch(()=>document.getElementById('results').innerHTML='<p class="mutedline">The catalogue could not be loaded. Please try again later.</p>');document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render()});document.getElementById('query').addEventListener('input',render);document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
