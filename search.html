b.category||'Digital ebook')+'</p><h2>'+esc(b.title)+'</h2><p>'+esc(b.description||'')+'</p><strong>₹'+Number(b.price||0).toLocaleString('en-IN')+'</strong><p><a class="btn btn--small" href="./#new-releases">View on homepage</a></p></article>').join(''):'<p class="mutedline">No ebooks match that search. Try another title or category.</p>';}fetch('ebook.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{books=Array.isArray(d.ebooks)?d.ebooks:[];render()}).catch(()=>document.getElementById('results').innerHTML='<p class="mutedline">The catalogue could not be loaded. Please try again later.</p>');document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render()});document.getElementById('query').addEventListener('input',render);document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
